# BTT Eddy Duo USB configuration for mainline Klipper.
# Created during Cartographer/BD Pressure -> BTT Eddy Duo migration.
# IMPORTANT: verify this serial after connecting/flashing Eddy Duo:
#   ls -l /dev/serial/by-id

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50445059387D401C-if00
restart_method: command

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
# Current Klipper uses descend_z. Do not use the older BTT sample z_offset key.
descend_z: 2.5
i2c_mcu: eddy
i2c_bus: i2c0f
# Measure after mounting the XOL/A4T Eddy Duo mount; these are only safe initial values.
x_offset: 0
y_offset: 21.42
# Enable only after PROBE_EDDY_CURRENT_TAP_CALIBRATE succeeds repeatedly.
# tap_threshold:
# tap_z_offset: 0.0

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
min_temp: 0
max_temp: 120
horizontal_move_z: 2
resting_z: 0.8
calibration_position: 120, 120, 8
calibration_extruder_temp: 160
extruder_heating_z: 50
calibration_bed_temp: 110
max_validation_temp: 100

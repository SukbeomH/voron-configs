#####################################################################
#   Macros
#####################################################################

[gcode_macro SET_FAKE_Z]
gcode:
    {% set z_value = params.Z|default(printer.toolhead.position.z)|float %}
    SET_KINEMATIC_POSITION Z={z_value}

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
    {% set Z = printer.toolhead.position.z %}
    {% set last_z = printer.probe.last_z_result %}
    # 프로브 결과값으로 시스템 좌표를 동기화하여 수동 창 발생을 원천 차단합니다.
    SET_KINEMATIC_POSITION Z={Z - last_z}
    # 현재 오프셋을 변수 파일에 저장하여 다음 출력 시 참조합니다.
    SAVE_VARIABLE VARIABLE=z_offset VALUE={last_z}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    M118 Syncing Z-Offset from probe...
    G90
    G0 X125 Y125 Z5 F6000

    G4 P500
    PROBE

    _RELOAD_Z_OFFSET_FROM_PROBE
    G0 Z5 F3000
    
[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: Z_OFFSET_APPLY_PROBE_ORIG
gcode:
    SAVE_VARIABLE VARIABLE=nvm_offset VALUE={ printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset }

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False  # Mark whether the var has been restored from NVM
variable_runtime_offset: 0
gcode:
    {% if params.Z_ADJUST %}
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE={ printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset + params.Z_ADJUST|float }
    {% endif %}
    {% if params.Z %} 
    {% set paramList = rawparams.split() %}
    {% for i in range(paramList|length) %}
      {% if paramList[i]=="Z=0" %}
        {% set temp=paramList.pop(i) %}
        {% set temp="Z_ADJUST=" + (-printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset)|string %}
        {% if paramList.append(temp) %}{% endif %}
      {% endif %}
    {% endfor %}
    {% set rawparams=paramList|join(' ') %}
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE=0
    {% endif %}
    SET_GCODE_OFFSET_ORIG { rawparams }

[gcode_macro SETTLE_BELTS]
description: 갠트리 장력 해소 매크로
gcode:
    {% set speed = params.SPEED|default(15000)|int %}
    {% set iterations = params.ITER|default(5)|int %}
    
    SAVE_GCODE_STATE NAME=settle_belts_state
    G28
    G90
    G1 Z20 F3000
    
    # 지정된 횟수만큼 원형 운동 반복
    {% for i in range(iterations) %}
        G1 X125 Y75 F{speed}     # 시작점
        G2 X125 Y75 I0 J50 F{speed} # 시계 방향
        G3 X125 Y75 I0 J50 F{speed} # 반시계 방향
    {% endfor %}
    
    G1 X125 Y125 F{speed}        # 중앙으로 복귀
    RESTORE_GCODE_STATE NAME=settle_belts_state
    M117 Belts Settled

[gcode_macro G32]
description: 전체 호밍 및 조건부 레벨링
gcode:
    CG28                # 조건부 홈 (없으면 실행)
    CQGL                # 조건부 QGL (안되어 있으면 실행)
    # 250mm Build 기준 중앙 이동
    G0 X125 Y125 Z30 F3600

[gcode_macro CLEAN_NOZZLE]
description: 후방 노즐 브러쉬에서 노즐 청소
variable_brush_x_min: 32.0
variable_brush_x_max: 52.0
variable_brush_y: 252.5
variable_brush_z: 1.5
variable_travel_z: 10.0
variable_wipe_count: 6
variable_wipe_speed: 6000
gcode:
    {% set cfg = printer["gcode_macro CLEAN_NOZZLE"] %}
    {% set x_min = params.X_MIN|default(cfg.brush_x_min)|float %}
    {% set x_max = params.X_MAX|default(cfg.brush_x_max)|float %}
    {% set y = params.Y|default(cfg.brush_y)|float %}
    {% set z = params.Z|default(cfg.brush_z)|float %}
    {% set travel_z = params.TRAVEL_Z|default(cfg.travel_z)|float %}
    {% set wipes = params.WIPES|default(cfg.wipe_count)|int %}
    {% set speed = params.SPEED|default(cfg.wipe_speed)|int %}

    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G0 Z{travel_z} F3000
    G0 X{x_min} Y{y} F6000
    G0 Z{z} F1200
    {% for i in range(wipes) %}
        G0 X{x_max} Y{y} F{speed}
        G0 X{x_min} Y{y} F{speed}
    {% endfor %}
    G0 Z{travel_z} F3000
    RESTORE_GCODE_STATE NAME=clean_nozzle_state

[gcode_macro PRINT_START]
description: PRINT_START 스마트 히팅 및 검증 파이프라인
gcode:
    # 1. 파라미터 수신 및 초기 변수 설정
    {% set target_bed = params.BED|default(110)|int %}
    {% set target_extruder = params.EXTRUDER|default(260)|int %}
    {% set target_chamber = params.CHAMBER|default(40)|int %}
    {% set pa_max_volumetric = params.PA_MAX_VOLUMETRIC|default(params.MAX_VOLUMETRIC|default(20))|float %}
    {% set pa_acc_wall = params.PA_ACC_WALL|default(4000)|float %}
    {% set pa_travel_speed = params.PA_TRAVEL_SPEED|default(400)|float %}
    {% set pa_acc_to_decel_factor = params.PA_ACC_TO_DECEL_FACTOR|default(50)|float %}
    {% set pa_scv = params.PA_SQUARE_CORNER_VELOCITY|default(9)|float %}
    {% set pa_line_z = params.PA_LINE_Z|default(0.3)|float %}
    {% set brush_z = params.BRUSH_Z|default(printer["gcode_macro CLEAN_NOZZLE"].brush_z)|float %}
    {% set brush_wipes = params.BRUSH_WIPES|default(printer["gcode_macro CLEAN_NOZZLE"].wipe_count)|int %}

    # [INIT] 파이프라인 시작 알림
    M118 >>> [JOB_START] Initializing Klipper Deployment Pipeline...    
    SET_GCODE_OFFSET Z=0
    ASSERT_TOOLHEAD_FILAMENT
    # -----------------------------------------------------------------
    # STAGE 1: THERMAL_SOAK (베드 가열 및 노즐 보온)
    # -----------------------------------------------------------------
    M118 >>> [STAGE: PRE-HEAT] Target Bed: {target_bed}C, Standby Extruder: 150C
    M117 Pre-heating...
    M104 S150                      # 노즐은 150도까지만 가열 (Ooze/필라멘트 탄화 방지)
    M140 S{target_bed}             # 베드 가열 시작 (비동기)
    
    G28                           # 홈이 안 되어 있다면 호밍
    G90
    G0 X125 Y125 Z30 F6000         # 히트소크를 위해 중앙으로 이동
    
    M190 S{target_bed}             # 베드 온도 도달까지 대기
    M118 >>> [STATUS] Bed temperature reached. Thermal expansion stabilized.

    # -----------------------------------------------------------------
    # STAGE 2: NOZZLE_CLEAN (후방 브러쉬)
    # -----------------------------------------------------------------
    M118 >>> [STAGE: NOZZLE_CLEAN] Cleaning nozzle on rear brush...
    M109 S150                      # 세척 및 Survey Touch 전 노즐 온도 안정화
    CLEAN_NOZZLE Z={brush_z} WIPES={brush_wipes}
    
    # -----------------------------------------------------------------
    # STAGE 3: VALIDATION (수평, 표면 스캔)
    # -----------------------------------------------------------------
    M118 >>> [STAGE: VALIDATION] Checking Gantry & Surface Mesh...
    CQGL                           # 조건부 QGL 실행 (이미 되어 있으면 스킵)

    CARTOGRAPHER_TOUCH_HOME        # QGL 이후 실제 Z0 재확인
    
    G90
    G0 X125 Y125 Z10 F6000         # 베드 중앙으로 이동
    
    M117 Meshing with Cartographer...
    BED_MESH_CALIBRATE ADAPTIVE=1  # Cartographer plugin handles scan mesh.

    M118 >>> [STAGE: FINAL_Z] Syncing final Z with BD Pressure nozzle probe...
    SET_Z_FROM_PROBE
    
    # (참고) Z 기준은 현재 probe/scanner 구성에서 관리합니다.
    M118 >>> [STATUS] Validation complete. Kinematics verified.

    # -----------------------------------------------------------------
    # STAGE 4: PA_CALIBRATION (BD Pressure)
    # -----------------------------------------------------------------
    M118 >>> [STAGE: PA_CAL] Running BD Pressure PA calibration...
    PA_STATE
    G90
    G0 X15 Y20 Z{pa_line_z} F6000
    PA_CALIBRATE NOZZLE_TEMP={target_extruder} MAX_VOLUMETRIC={pa_max_volumetric} ACC_WALL={pa_acc_wall} TRAVEL_SPEED={pa_travel_speed} ACC_TO_DECEL_FACTOR={pa_acc_to_decel_factor} SQUARE_CORNER_VELOCITY={pa_scv}
    G90
    G0 X15 Y20 Z10 F6000
    M118 >>> [STATUS] PA calibration complete.
    SET_BDWIDTH NAME=fila_width_0 COMMAND=ENABLE

    # -----------------------------------------------------------------
    # STAGE 5: DEPLOY (최종 가열 및 프라이밍)
    # -----------------------------------------------------------------
    M118 >>> [STAGE: DEPLOY] Moving to Purge Area & Final Heating...
    G0 X15 Y20 Z10 F6000           # 프라이밍 위치(베드 앞쪽)로 이동
    
    M117 Heating Extruder...
    M109 S{target_extruder}        # 실제 출력 온도까지 가열 및 대기
    
    M118 >>> [STATUS] Execution: Purge Line starting...
    M117 Purging...
    
    # 프라이밍 라인 출력 (기존 로직 그대로 활용)
    G92 E0                         
    G0 Z0.3 F3000                  
    G1 Y150 E15 F1500              
    G1 X15.4 F6000                 
    G1 Y20 E30 F1500               
    
    G92 E0                         
    G0 Z2.0 F3000                  
    
    # [FINISH] 파이프라인 완료
    M118 >>> [SUCCESS] Deployment successful. Start Printing...
    M117 Printing...


[gcode_macro PRINT_END]
gcode:
    # 안전한 좌표 계산 (최대 높이 초과 방지)
    {% set th = printer.toolhead %}
    {% set x_safe = th.axis_maximum.x - 20 %}
    {% set y_safe = th.axis_maximum.y - 20 %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; 버퍼 비우기
    G92 E0                         ; 익스트루더 0점
    G1 E-1.0 F3600                 ; 1.0mm (직결식 기준 안전값)
    
    TURN_OFF_HEATERS
    SET_BDWIDTH NAME=fila_width_0 COMMAND=DISABLE
    
    G90                                      ; 절대 좌표
    G0 Z{z_safe} F3600                       ; Z 살짝 상승
    G0 X{x_safe} Y{y_safe} F3600             ; 뒤쪽 구석으로 파킹 (보통 Max 좌표 쪽)
    M107                                     ; 팬 끄기
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

#####################################################################
#  Conditional Macros (조건부 실행)
#####################################################################

[gcode_macro CG28]
description: 홈이 안 되어 있을 때만 G28 실행 (Conditional Homing)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Conditional Homing...
        G28
    {% endif %}

[gcode_macro CQGL]
description: QGL이 적용 안 되어 있을 때만 실행 (Conditional QGL)
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        M117 Conditional QGL...
        G90
        # QGL을 하려면 먼저 홈이 되어 있어야 하므로 체크
        CG28
        
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}


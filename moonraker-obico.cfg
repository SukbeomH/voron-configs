[server]
url = http://192.168.0.184:3334
# Do not commit a live Obico token to the public config repository.
# Set the real value only on the printer host.
auth_token = <set-on-live-host>

[moonraker]
host = 127.0.0.1
port = 7125

[webcam]
disable_video_streaming = False
target_fps = 20
snapshot_url = /webcam/?action=snapshot
stream_url = /webcam/?action=stream
rotation = 0

[logging]
path = /home/sukbeom/printer_data/logs/moonraker-obico.log

[tunnel]

[misc]
sentry_opt = in

[include mcu_flasher.cfg]
[include chopper_tune.cfg]
[include mainsail.cfg]
[include printer_toolhead_usb.cfg]
[include printer_bd_pressure_usb.cfg]
[include printer_cartographer.cfg]
[include printer_mainboard.cfg] # 메인보드(모터, 베드) 설정 불러오기
[include printer_toolhead_rgb.cfg]
[include printer_bme280_toolhead.cfg]
[include printer_filament_sensors.cfg]
[include printer_bdwidth.cfg]
[include klippain-shaketune.cfg]
[include macros.cfg]
[input_shaper]
[respond]

[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.4:1.0-port0
baud: 250000
restart_method: command

[printer]
max_velocity: 600
max_accel: 8000
minimum_cruise_ratio: 0.5
kinematics: corexy
max_z_velocity: 15          
max_z_accel: 150
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

[exclude_object]

[gcode_arcs]
resolution: 0.3

[save_variables]
filename: ~/printer_data/config/variables.cfg

#####################################################################
#   Homing & Gantry Leveling (250mm Build)
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 3
# Cartographer Y offset is +43mm; front probe points below Y43 would move the nozzle below Y0.
mesh_min: 25, 45
# X movement max is 250; measured rear bed edge is Y249.
mesh_max: 225, 245
zero_reference_position: 125, 120
adaptive_margin: 5
probe_count: 50, 50
algorithm: bicubic
bicubic_tension: 0.1
split_delta_z: 0.0125
move_check_distance: 3.0

[safe_z_home]
home_xy_position: 125, 120  # 기계적 중앙으로 변경
z_hop: 8                        # QGL/mesh 이동 중 베드 접촉 방지를 위해 여유 확보
z_hop_speed: 25
speed: 200

[quad_gantry_level]
gantry_corners:
   -60,-10
   310, 320
points:
	25, 5
	25, 200
	225, 200
	225, 5
speed: 250
horizontal_move_z: 4
retries: 10
retry_tolerance: 0.060
max_adjust: 10

[include moonraker_obico_macros.cfg]

[include shell_command.cfg]


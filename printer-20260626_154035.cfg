[include plr.cfg]
[include mcu_flasher.cfg]
[include chopper_tune.cfg]
[include klippain-shaketune.cfg]
[include mainsail.cfg]
[include printer_toolhead_usb.cfg]
# [include printer_bd_pressure_usb.cfg]  # disabled 2026-06-24: BD Pressure not working; Cartographer-only Z/probe
# [include printer_bdwidth.cfg]  # disabled: BDWidth/runout disabled 2026-06-16
[include printer_cartographer.cfg]
[include printer_mainboard.cfg]
[include printer_bme280_toolhead.cfg]
# [include printer_filament_sensors.cfg]  # disabled: filament/runout sensors disabled 2026-06-16
[include printer_filament_buffer.cfg]
[include lll_plus.cfg]
[include printer_toolhead_rgb.cfg]
[include macros.cfg]
[include moonraker_obico_macros.cfg]
[input_shaper]
[respond]

[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usbv2-0:1.2.1:1.0-port0
baud: 250000
restart_method: command

[printer]
max_velocity: 500
max_accel: 6800
minimum_cruise_ratio: 0.5
kinematics: corexy
max_z_velocity: 15          
max_z_accel: 150
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

[exclude_object]

[gcode_arcs]
resolution: 0.3

[save_variables]
filename: ~/printer_data/config/variables.cfg

#####################################################################
#   Homing & Gantry Leveling (250mm Build)
#####################################################################

[bed_mesh]
speed: 200
horizontal_move_z: 3
# Cartographer probe center coordinates; re-check after measuring final x_offset/y_offset.
mesh_min: 15, 25
mesh_max: 235, 210
zero_reference_position: 120, 120
adaptive_margin: 5
# Conservative Cartographer validation. Restore 30,30 after scan behavior is stable.
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0
move_check_distance: 3.0

[safe_z_home]
home_xy_position: 120, 120
z_hop: 8                        # QGL/mesh 이동 중 베드 접촉 방지를 위해 여유 확보
z_hop_speed: 25
speed: 200

[quad_gantry_level]
# 노즐 위치 좌표를 의미함. 오프셋 +25 염두.
gantry_corners:
   -65,-10
   305, 320
points:
    25, 0
    25, 200
    215, 200
    215, 0
speed: 250
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.030
max_adjust: 10


[include printer_homing.cfg]
[include plr.cfg]
[include mcu_flasher.cfg]
[include chopper_tune.cfg]
[include klippain-shaketune.cfg]
[include mainsail.cfg]
[include printer_toolhead_usb.cfg]
# [include printer_bd_pressure_usb.cfg]  # disabled 2026-06-24: BD Pressure not working; Eddy owns Z/probe
[include printer_bdwidth.cfg]
# [include printer_cartographer.cfg]  # removed: Cartographer hardware replaced with BTT Eddy on EBB I2C
[include printer_eddy.cfg]
[include printer_mainboard.cfg]
# [include printer_bme280_toolhead.cfg]  # removed: toolhead air BME280 sensor disconnected
[include printer_toolhead_sensors.cfg]
# [include printer_filament_sensors.cfg]  # disabled: filament/runout sensors disabled 2026-06-16
[include printer_filament_buffer.cfg]
# [include lll_plus.cfg]  # disabled 2026-07-13: LLL Plus reverting to standalone/original firmware
[include printer_toolhead_rgb.cfg]
[include macros.cfg]
[input_shaper]
[respond]

[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usbv2-0:1.2.4:1.0-port0 
baud: 250000
restart_method: command

[printer]
max_velocity: 650
max_accel: 7000
minimum_cruise_ratio: 0.5
kinematics: corexy
max_z_velocity: 25
max_z_accel: 500
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

[exclude_object]

[gcode_arcs]
resolution: 0.3

[save_variables]
filename: ~/printer_data/config/variables.cfg

#####################################################################
#   Homing & Gantry Leveling (250mm Build)
#####################################################################

[bed_mesh]
speed: 350
horizontal_move_z: 2
# Eddy probe center coordinates; re-check after measuring final x_offset/y_offset.
mesh_min: 15, 35
mesh_max: 230, 220
zero_reference_position: 125, 100
probe_count: 30, 30
adaptive_margin: 10
# Keep probed_matrix and mesh_matrix separate so zero_reference_position
# is applied once per matrix instead of twice in Klipper's direct mode.
mesh_pps: 1,1
algorithm: bicubic
move_check_distance: 3.0



[quad_gantry_level]
# 노즐 위치 좌표를 의미함. 오프셋 +25 염두.
gantry_corners:
   -65,-10
   305, 320
points:
    25, 0
    25, 200
    215, 200
    215, 0
speed: 150
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.030
max_adjust: 10


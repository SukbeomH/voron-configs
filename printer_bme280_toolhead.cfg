[temperature_sensor toolhead_air]
sensor_type: BME280
i2c_mcu: EBBusb
i2c_bus: i2c3_PB3_PB4
i2c_address: 118
i2c_speed: 100000
min_temp: -20
max_temp: 120
gcode_id: THA

[temperature_sensor EBBusb_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBusb
min_temp: 0
max_temp: 100

[gcode_macro QUERY_TOOLHEAD_AIR]
description: Report toolhead air temperature, humidity, and pressure
gcode:
    {% set sensor = printer["bme280 toolhead_air"] %}
    { action_respond_info("toolhead_air: %.2f C, %.2f %%RH, %.2f hPa" % (sensor.temperature, sensor.humidity, sensor.pressure)) }

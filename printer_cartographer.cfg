[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32f042x6_160011000A43565537353020-if00
restart_method: command

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 30
verbose: no
register_as_probe: true

[cartographer scan]
mesh_height: 3
mesh_runs: 3
mesh_direction: x
mesh_path: snake

[cartographer touch]
samples: 3
max_samples: 25
max_noisy_samples: 2
sample_range: 0.015
retract_distance: 2.0

[lis2dw cartographer]
cs_pin: cartographer:PA3
spi_bus: spi1
axes_map: x, z, -y

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 125

[axis_twist_compensation]

[mcu cartographer]
# serial: /dev/serial/by-id/usb-Cartographer_614e_160011000A43565537353020-if00
serial: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.4:1.0-port0
restart_method: command

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 25
verbose: no
register_as_probe: true

[cartographer scan]
mesh_height: 3
mesh_runs: 2
mesh_direction: x
mesh_path: snake

[cartographer touch]
samples: 3
max_samples: 10
max_noisy_samples: 2
sample_range: 0.010
retract_distance: 2.0

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 125

[axis_twist_compensation]

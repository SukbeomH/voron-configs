[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_614e_160011000A43565537353020-if00
restart_method: command

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 43
verbose: no
register_as_probe: false

[cartographer scan]
mesh_height: 3
mesh_runs: 2
mesh_direction: x
mesh_path: snake

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

[axis_twist_compensation]

[filament_switch_sensor toolhead_filament]
# PB4 is reserved by the toolhead BME280 I2C bus on this build.
switch_pin: ^!EBBusb:PB5
pause_on_runout: False
event_delay: 3.0
debounce_delay: 0.5
runout_gcode:
    RESPOND TYPE=echo MSG="Toolhead filament sensor: filament not detected"
insert_gcode:
    RESPOND TYPE=echo MSG="Toolhead filament sensor: filament detected"

[gcode_macro ASSERT_TOOLHEAD_FILAMENT]
description: Abort start if the CW2/toolhead filament sensor does not detect filament.
gcode:
    {% if not printer["filament_switch_sensor toolhead_filament"].filament_detected %}
        { action_raise_error("Toolhead filament sensor does not detect filament. Load filament before PRINT_START.") }
    {% endif %}

[gcode_macro FILAMENT_STATUS]
description: Query filament-related devices.
gcode:
    QUERY_FILAMENT_SENSOR SENSOR=toolhead_filament
    PA_STATE
    SET_BDWIDTH NAME=fila_width_0 COMMAND=QUERY

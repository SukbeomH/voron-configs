[filament_switch_sensor extruder_entry_filament]
# Filament path entry sensor at the extruder start.
switch_pin: ^!EBBusb:PB5
pause_on_runout: False
event_delay: 2.0
debounce_delay: 3.0
runout_gcode:
    RESPOND TYPE=echo MSG="Extruder entry filament sensor: filament not detected"
insert_gcode:
    RESPOND TYPE=echo MSG="Extruder entry filament sensor: filament detected"

[filament_switch_sensor extruder_exit_filament]
# Filament path exit sensor at the toolhead/extruder end.
switch_pin: ^!EBBusb:PB6
pause_on_runout: False
event_delay: 1.0
debounce_delay: 1.0
runout_gcode:
    RESPOND TYPE=echo MSG="Extruder exit filament sensor: filament not detected"
insert_gcode:
    RESPOND TYPE=echo MSG="Extruder exit filament sensor: filament detected"

[gcode_macro ASSERT_TOOLHEAD_FILAMENT]
description: Abort start unless both extruder filament path sensors detect filament.
gcode:
    {% set entry = printer["filament_switch_sensor extruder_entry_filament"].filament_detected %}
    {% set exit = printer["filament_switch_sensor extruder_exit_filament"].filament_detected %}
    {% if not entry or not exit %}
        { action_raise_error("Filament path incomplete before PRINT_START. entry=%s exit=%s" % (entry, exit)) }
    {% endif %}

[gcode_macro FILAMENT_STATUS]
description: Query filament-related devices.
gcode:
    QUERY_FILAMENT_SENSOR SENSOR=extruder_entry_filament
    QUERY_FILAMENT_SENSOR SENSOR=extruder_exit_filament
    PA_STATE
    SET_BDWIDTH NAME=fila_width_0 COMMAND=QUERY

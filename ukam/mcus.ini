# UKAM MCU definitions for Voron 2.4 on RPi4B host.
# This file intentionally uses flash-guard.sh so UI/CLI tests do not flash by accident.
# Actual flashing requires both a present device path and UKAM_ALLOW_FLASH=1.

[mcu]
klipper_section: mcu
config_name: manta-m8p-2
action_command: ~/printer_data/config/ukam/flash-guard.sh mcu /dev/serial/by-id/usb-Klipper_stm32h723xx_1F002C001251313531383332-if00 make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32h723xx_1F002C001251313531383332-if00

[EBBusb]
klipper_section: mcu EBBusb
is_klipper_fw: false
action_command: echo "[UKAM] EBBusb: build/flash command not enabled yet; missing verified stm32g0b1xx Kconfig for this board."

[cartographer]
klipper_section: mcu cartographer
is_klipper_fw: false
action_command: ~/printer_data/config/ukam/flash-guard.sh cartographer /dev/serial/by-id/usb-Cartographer_614e_160011000A43565537353020-if00 git -C ~/cartographer_firmware pull --ff-only
action_command: ~/printer_data/config/ukam/flash-guard.sh cartographer /dev/serial/by-id/usb-Cartographer_614e_160011000A43565537353020-if00 ~/cartographer_firmware/fw_update.sh
